[project]
name = "seatlock-django"
version = "1.0.0"
description = "SeatLock on Django and Django REST Framework (Backend Polyglot, Chapter 27)"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1",
    "djangorestframework>=3.16",
    "gunicorn>=23.0",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.10",
    "redis>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "seatlock.settings"
pythonpath = ["."]

[tool.ruff]
line-length = 140

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.9",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

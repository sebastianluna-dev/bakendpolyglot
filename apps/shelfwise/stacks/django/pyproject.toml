[project]
name = "shelfwise-django"
version = "1.0.0"
description = "Shelfwise on Django and Django REST Framework (Backend Polyglot, Chapter 18)"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.3",
    "djangorestframework>=3.18.3",
    "gunicorn>=27.0.0",
    "psycopg[binary]>=3.3.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "shelfwise.settings"
pythonpath = ["."]

[tool.ruff]
line-length = 110

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]
